<h1 class="my-[2rem] font-bold text-[2rem] px-[30px]">{{ category() }}</h1>

<div class="responsive-grid px-[30px]">
  @for (item of filterProduct(); track item.id ){
  <div
    class="group relative bg-white border border-gray-100 rounded-2xl p-4 h-[460px] flex flex-col transition-all duration-300 hover:shadow-2xl hover:border-blue-100"
  >
    <div class="relative aspect-square overflow-hidden rounded-xl bg-gray-50">
      <img
        [src]="item.imageUrl"
        [alt]="item.name"
        class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
      />

      <div
        class="absolute top-2 left-2 bg-white/80 backdrop-blur-sm px-2 py-1 rounded-lg flex items-center gap-1 shadow-sm"
      >
        <span class="text-amber-500 text-xs font-bold">★</span>
        <span class="text-[10px] font-bold text-gray-700">{{ item.rating }}</span>
      </div>
    </div>

    <div class="flex flex-col flex-grow mt-4">
      <div class="flex justify-between items-center mb-1">
        <span class="text-[10px] font-bold uppercase tracking-widest text-blue-600">{{
          item.category
        }}</span>
        <span *ngIf="item.inStock" class="flex items-center gap-1">
          <span class="w-1.5 h-1.5 bg-green-500 rounded-full"></span>
          <span class="text-[10px] text-gray-500 font-medium">In Stock</span>
        </span>
      </div>

      <h3
        class="text-sm font-semibold text-gray-800 line-clamp-2 min-h-[40px] leading-tight cursor-default"
      >
        {{ item.name }}
      </h3>

      <div class="mt-auto space-y-3">
        <div class="flex items-baseline gap-1">
          <span class="text-xs font-bold text-gray-900">$</span>
          <span class="text-xl font-black text-gray-900">{{ item.price }}</span>
        </div>

        <button
          mat-flat-button
          color="primary"
          [disabled]="!item.inStock"
          class="w-full !rounded-xl !py-6 !font-bold !text-xs uppercase tracking-wider transition-all active:scale-95 disabled:opacity-50"
        >
          {{ item.inStock ? 'Add to Cart' : 'Out of Stock' }}
        </button>
      </div>
    </div>
  </div>
  }
</div>
