<nav

        <button

        </button>

        <div
          class="absolute left-0 pt-4 w-60 invisible opacity-0 translate-y-2 group-hover:visible group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300 z-50"
        >
          <div class="bg-white border border-gray-100 shadow-xl py-2">
            <a
              [routerLink]="['/products', 'kitchen']"
              class="block px-6 py-3 text-[10px] tracking-widest uppercase text-gray-950 hover:text-black hover:bg-gray-50 transition-colors"
            >
              Kitchen
            </a>
            <a
              [routerLink]="['/products', 'fashion']"
              class="block px-6 py-3 text-[10px] tracking-widest uppercase text-gray-950 hover:text-black hover:bg-gray-50 transition-colors"
            >
              FASHION
            </a>
            <a
              [routerLink]="['/products', 'Electronics']"
              class="block px-6 py-3 text-[10px] tracking-widest uppercase text-gray-950 hover:text-black hover:bg-gray-50 transition-colors"
            >
              ELECTRINIC
            </a>
            <div class="mx-6 border-t border-gray-50 my-1"></div>
            <a
              [routerLink]="['/products', 'all']"
              class="block px-6 py-3 text-[10px] tracking-widest uppercase text-gray-950 hover:text-black hover:bg-gray-50 transition-colors"
            >
              Shop All
            </a>
          </div>
        </div>
      </li>
      <li class="hover:bg-gray-200 px-5 py-3 transition-colors cursor-pointer">MEN</li>
      <li class="hover:bg-gray-200 px-5 py-3 transition-colors cursor-pointer">BOYS</li>
      <li class="hover:bg-gray-200 px-5 py-3 transition-colors cursor-pointer">GIRLS</li>

          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="w-6 h-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"

          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="w-6 h-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.11 13.5A2.25 2.25 0 0 1 18.477 24H5.523a2.25 2.25 0 0 1-2.238-2.493l1.11-13.5A2.25 2.25 0 0 1 6.63 6h10.74a2.25 2.25 0 0 1 2.238 2.007Z"

    <div class="flex items-center gap-4 text-[13px] font-bold text-gray-800 ml-2">
      <button matButton="tonal">SIGNIN</button>
      <button matButton="filled">REGISTER</button>
    </div>
  </div>
</nav>
